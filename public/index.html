<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" name="viewport"/>
<title>AMAVAS</title>
<!-- installable: Add to Home Screen gives a full-screen app with no browser chrome -->
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#111319"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Amavas"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<!-- vendored locally: game night WiFi may have no internet (see vendor-assets.js) -->
<script src="vendor/tailwind.js"></script>
<link href="vendor/fonts.css" rel="stylesheet"/>
<script>
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "border-subtle": "#30363d", "tertiary-container": "#ff6f5f",
      "surface-container-low": "#191b22", "surface-container": "#1e1f26",
      "surface-container-high": "#282a30", "surface-container-highest": "#33343b",
      "surface-container-lowest": "#0c0e14", "surface-variant": "#33343b",
      "surface-bright": "#373940", "surface": "#111319", "surface-dim": "#111319",
      "background": "#111319", "on-surface": "#e2e2eb", "on-surface-variant": "#bec7d4",
      "on-background": "#e2e2eb", "text-high-contrast": "#e1e4e8", "text-muted": "#8b949e",
      "outline-variant": "#3f4852", "outline": "#88919d",
      "primary": "#98cbff", "primary-container": "#00a3ff", "on-primary": "#003354",
      "on-primary-fixed": "#001d33", "error": "#ffb4ab", "error-container": "#93000a",
    },
    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px", "3xl": "2rem" },
    spacing: { gutter: "16px", "stack-gap": "12px", "margin-md": "24px", "margin-sm": "16px", "safe-bottom": "96px" },
    fontFamily: {
      "label-caps": ["JetBrains Mono", "monospace"], "label-mono": ["JetBrains Mono", "monospace"],
      "headline-md": ["Epilogue", "serif"], "headline-lg": ["Epilogue", "serif"],
      "display-lg": ["Epilogue", "serif"], "body-md": ["Inter", "sans-serif"], "body-lg": ["Inter", "sans-serif"],
    },
    fontSize: {
      "label-caps": ["11px", { lineHeight: "16px", letterSpacing: "0.1em", fontWeight: "700" }],
      "label-mono": ["13px", { lineHeight: "18px", letterSpacing: "0.05em", fontWeight: "500" }],
      "headline-md": ["24px", { lineHeight: "32px", fontWeight: "600" }],
      "headline-lg": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }],
      "display-lg": ["44px", { lineHeight: "48px", letterSpacing: "-0.04em", fontWeight: "800" }],
      "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }],
      "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
    },
  } },
}
</script>
<style>
  html, body { background: #111319; }
  body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  /* film grain */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: .75;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  }
  .glass-panel {
    background: #1e1f26; border-top: 1px solid rgba(152,203,255,.15);
    box-shadow: inset 0 1px 0 rgba(152,203,255,.1);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  }
  .dossier-card { box-shadow: inset 0 1px 0 rgba(152,203,255,.08); transition: all .2s ease; }
  .dossier-card.active { box-shadow: inset 0 1px 0 rgba(152,203,255,.3), 0 0 12px 3px rgba(152,203,255,.1); border-color: rgba(152,203,255,.35); }
  .dossier-card.extinguished { opacity: .5; }
  .shimmer { position: relative; overflow: hidden; }
  .shimmer::after {
    content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,.12), transparent);
    transform: skewX(-20deg); animation: sh 3s infinite;
  }
  @keyframes sh { 0% { left: -100%; } 100% { left: 220%; } }
  @keyframes pulse-ring {
    0% { transform: scale(.96); box-shadow: 0 0 0 0 rgba(152,203,255,.35); }
    70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(152,203,255,0); }
    100% { transform: scale(.96); box-shadow: 0 0 0 0 rgba(152,203,255,0); }
  }
  .pulse-ring { animation: pulse-ring 2.4s infinite; }
  @keyframes stripe { from { background-position: 0 0; } to { background-position: 16px 0; } }
  .stripes {
    background-image: linear-gradient(45deg, rgba(255,255,255,.12) 25%, transparent 25%, transparent 50%,
      rgba(255,255,255,.12) 50%, rgba(255,255,255,.12) 75%, transparent 75%, transparent);
    background-size: 16px 16px; animation: stripe 1s linear infinite;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-up { animation: fadeUp .35s ease both; }
  .scanlines::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .1; z-index: 30;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(152,203,255,.25) 3px, transparent 4px);
  }
  /* opening screen */
  @keyframes bootRise { from { opacity:0; transform: translateY(10px) scale(.94); } to { opacity:1; transform:none; } }
  @keyframes bootGlow {
    0%,100% { filter: drop-shadow(0 0 18px rgba(255,111,95,.18)); }
    50%     { filter: drop-shadow(0 0 34px rgba(255,111,95,.42)); }
  }
  @keyframes bootSlide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .boot-moon { animation: bootRise .7s ease both, bootGlow 3s ease-in-out infinite .7s; }
  .boot-fade { animation: bootRise .7s ease both .18s; }
  .boot-bar  { animation: bootSlide 1.4s ease-in-out infinite; }

  /* role reveal: hidden until held */
  #revealArea .veil { transition: opacity .18s ease; }
  #revealArea.revealing .veil { opacity: 0; pointer-events: none; }
  .ms { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 1; font-size: 20px; line-height: 1; }
  .ms.o { font-variation-settings: 'FILL' 0; }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body class="bg-background text-on-background antialiased font-body-md">
  <div id="app"></div>
  <div id="overlay"></div>
  <script src="art/portraits.js"></script>
  <script src="client.js"></script>
</body>
</html>
